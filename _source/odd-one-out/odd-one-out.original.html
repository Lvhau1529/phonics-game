/* Student identity, response clock, and leaderboard */
.top-actions{flex-wrap:wrap;justify-content:flex-end}
.player-chip,.timer-chip{font-size:13px;font-weight:1000;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:11px 13px;white-space:nowrap}
.player-chip{color:#6655ad;background:#f1ecff;border:2px solid #e3dafe;max-width:185px;overflow:hidden;text-overflow:ellipsis}
.timer-chip{color:#087b8c;background:#e4faff;border:2px solid #c9eff7;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer-chip.running{animation:timerGlow 2s ease-in-out infinite}
@keyframes timerGlow{50%{box-shadow:0 0 0 5px #a1e6ef62}}
.name-card{width:min(460px,100%);margin:22px auto 8px;padding:18px 20px;border-radius:24px;border:2px solid #dfd7ff;background:linear-gradient(145deg,#fbfaff,#f0ecff);box-shadow:0 6px 0 #e4ddf7}
.name-card label{display:block;color:#55519a;font-weight:1000;font-size:16px;margin:0 0 10px}
.name-input{width:100%;min-height:55px;border-radius:16px;border:2px solid #dcd6f6;background:white;color:#35365d;padding:13px 17px;font-size:19px;font-weight:900;text-align:center;outline:none}
.name-input:focus{border-color:#9280ef;box-shadow:0 0 0 4px #dcd4ff}
.name-error{min-height:20px;margin:8px 0 0;color:#ca3e6c;font-size:13px;font-weight:900}
.name-help{font-size:12px;color:#8584a9;margin:9px 0 0}
.timer-strip{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:7px;align-items:center;padding:10px 16px;background:#e8faff;border:2px solid #bceef5;border-radius:16px;color:#18798d;font-weight:1000;font-size:15px;margin:13px 0 0;font-variant-numeric:tabular-nums}
.timer-strip .clock-number{font-size:20px;color:#296caa;min-width:55px}
.time-complete{margin:13px auto 7px;padding:11px 18px;background:#f0f6ff;border:2px solid #dde8ff;border-radius:15px;width:fit-content;color:#4966aa;font-weight:900}
.leader-hero{padding:7px 0 18px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:13px;margin:17px auto 24px;max-width:780px}
.podium-card{flex:1;min-width:0;max-width:255px;border-radius:25px 25px 16px 16px;border:2px solid #ece7ff;background:#f9f7ff;padding:15px 8px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 7px 0 #e0dbf5}
.podium-card.first{min-height:190px;background:linear-gradient(160deg,#fff6cc,#fff9e9);border-color:#ffde8b;box-shadow:0 8px 0 #f1d78c}
.podium-card.second{min-height:170px;background:#f0f8ff;border-color:#dceafa;box-shadow:0 7px 0 #d7e3f3}
.podium-card.third{min-height:150px;background:#fff0e9;border-color:#f6d9c6;box-shadow:0 7px 0 #edcdb9}

function safeGet(key){try{return localStorage.getItem(key)}catch(_){return null}}
function safeSet(key,value){try{localStorage.setItem(key,value);return true}catch(_){return false}}
function safeRemove(key){try{localStorage.removeItem(key);return true}catch(_){return false}}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function formatDuration(milliseconds){const s=Math.max(0,Math.ceil(milliseconds/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function loadBoard(){try{let arr=JSON.parse(safeGet(STORAGE_KEY)||'[]');return Array.isArray(arr)?arr.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.score)&&Number.isFinite(x.totalMs)&&typeof x.topic==='string').slice(-500):[]}catch(_){return []}}
function boardSort(a,b){return b.score-a.score||b.correct-a.correct||a.totalMs-b.totalMs||a.createdAt-b.createdAt}
function saveRun(){const rec={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name:playerName,topic,level,count:questions.length,score,correct:correctCount,totalMs:questionDurations.reduce((a,b)=>a+(b||0),0),times:[...questionDurations],createdAt:Date.now()};lastRun=rec;if(!assisted){let rows=loadBoard();rows.push(rec);if(rows.length>500)rows=rows.slice(-500);safeSet(STORAGE_KEY,JSON.stringify(rows))}return rec}
function playerBadge(){$('playerBadge').textContent='👤 '+(playerName||'Guest')}
function stopTimer(save=false){if(questionTimer!==null){clearInterval(questionTimer);questionTimer=null}if(save&&questionStartedAt){questionDurations[index]=Math.max(0,Date.now()-questionStartedAt)}questionStartedAt=0;updateTimerBadge()}
function updateTimerBadge(){const elapsed=questionStartedAt?Date.now()-questionStartedAt:0;const label=formatDuration(elapsed);$('clockBadge').textContent='⏱ '+label;$('clockBadge').classList.toggle('running',!!questionStartedAt);const live=$('timeNow');if(live)live.textContent=label}
function beginTimer(){stopTimer();questionStartedAt=Date.now();questionTimer=setInterval(updateTimerBadge,250);updateTimerBadge()}

function leaderboard(preset=null){resetCurrent();stage='leaderboard';const rows=loadBoard();const choices=['All topics',...Object.keys(ICONS),'Mixed Topics'];const preferred=preset||{};const topicValue=preferred.topic||'All topics',levelValue=preferred.level||'all',countValue=preferred.count||'all';panel(`<div class="leader-hero"><span class="eyebrow">🏅 OUR LITTLE SUPERSTARS 🏅</span><h1 class="title">The <span class="accent">Leaderboard!</span></h1><p class="sub">Who has earned the most stars? Check out our speaking champions! 🌟</p></div><div class="podium" id="podium"></div><div class="board-filters"><label class="board-filter">🎨 Topic<select id="filterTopic">${choices.map(t=>`<option value="${escapeHTML(t)}" ${t===topicValue?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></label><label class="board-filter">🚀 Level<select id="filterLevel"><option value="all">All levels</option><option value="easy">Easy</option><option value="challenge">Challenge</option><option value="both">Both levels</option></select></label><label class="board-filter">🧩 Questions<select id="filterCount"><option value="all">All lengths</option>${[3,6,9,12,15,30,90].map(n=>`<option value="${n}">${n} questions</option>`).join('')}</select></label></div><div id="boardContent"></div><p class="board-note">Scores are ranked from highest to lowest; ties are decided by correct answers and then faster total time. Use filters to compare games with the same topic, level, and number of questions. Only the best attempt by each name is shown for the chosen filters. Results are stored in this browser on this device, not shared between devices.</p><div><button class="btn alt" id="backBoard">← BACK</button><button class="btn green" id="playBoard">🚀 PLAY & EARN STARS</button></div>`);$('filterLevel').value=levelValue;$('filterCount').value=countValue;
 const render=()=>{const t=$('filterTopic').value,l=$('filterLevel').value,c=$('filterCount').value;const selected=rows.filter(r=>(t==='All topics'||r.topic===t)&&(l==='all'||r.level===l)&&(c==='all'||String(r.count)===c));const byName=new Map();for(const rec of selected){const key=rec.name.trim().toLocaleLowerCase();const prev=byName.get(key);if(!prev||boardSort(rec,prev)<0)byName.set(key,rec)}const sorted=[...byName.values()].sort(boardSort),winners=sorted.slice(0,3);
 $('podium').innerHTML=winners.length?winners.map((r,i)=>`<div class="podium-card ${['first','second','third'][i]}"><span class="podium-icon">${['🥇','🥈','🥉'][i]}</span><span class="podium-name">${escapeHTML(r.name)}</span><span class="podium-score">⭐ ${r.score}</span><span class="podium-sub">⏱ ${formatDuration(r.totalMs)}</span></div>`).join(''):`<div class="speech" style="width:100%;font-size:19px">🎈 No scores yet!<br>Be the first speaking champion!</div>`;

tudentName').onkeydown=e=>{if(e.key==='Enter')submit()};$('studentName').oninput=()=>{$('nameError').textContent=''};$('welcomeBoard').onclick=()=>{const v=$('studentName').value.trim().slice(0,26);if(v){playerName=v;playerBadge()}returnFromBoard='welcome';leaderboard()}}

function topics(){resetCurrent();stage='topics';score=0;correctCount=0;setScore();panel(`<div class="topic-heading"><span class="eyebrow">🗺️ YOUR ADVENTURE MAP</span><h1 class="title">Pick a <span class="accent">fun topic!</span></h1><p class="sub">Choose your favorite world. Every picture has a story!</p><div class="topic-summary"><span class="summary-badge">👤 ${escapeHTML(playerName||'Guest')}</span><span class="summary-badge">🌈 15 topics</span><span class="summary-badge">🏆 Earn stars</span><span class="summary-badge">⏱ Beat your time</span></div><button class="btn alt" id="switchPlayer">✏️ CHANGE STUDENT</button><button class="btn alt" id="topicBoard">🏆 VIEW LEADERBOARD</button></div><div class="topics" id="topicGrid"></div>`,'story-topics');$('switchPlayer').onclick=()=>{playerName='';safeRemove(NAME_KEY);welcome()};$('topicBoard').onclick=()=>{returnFromBoard='topics';leaderboard()};let grid=$('topicGrid');const tones=[['#fff0f6','#ffdbe8','#f5d5e3'],['#f0ecff','#dfd8ff','#dad0f7'],['#e9f8ff','#d5effa','#c9e7f3'],['#eafff5','#ccefe0','#c4ebd9'],['#fff6e4','#ffe8bd','#f6dfba']];Object.entries(ICONS).forEach(([name,emoji],i)=>{let b=document.createElement('button');b.className='topic';let t=tones[i%tones.length];b.style.setProperty('--card',t[0]);b.style.setProperty('--stroke',t[1]);b.style.setProperty('--bottom',t[2]);b.innerHTML=`<span class="topic-index">${String(i+1).padStart(2,'0')}</span><span class="pic">${emoji}</span><span class="topic-name">${name}</span>`;b.onclick=()=>levels(name);grid.appendChild(b)});let b=document.createElement('button');b.className='topic';b.innerHTML='<span class="topic-index">★</span><span class="pic">🎲</span><span class="topic-name">Mixed Topics</span>';b.onclick=()=>levels('Mixed Topics');grid.appendChild(b)}

function levels(t){topic=t;stage='levels';panel(`<span class="eyebrow">✨ PICK YOUR CHALLENGE</span><div class="hero-bubbles" style="height:120px"><span style="font-size:83px;filter:drop-shadow(0 10px 0 #e9e7f6)">${ICONS[t]||'🎲'}</span></div><h1 class="title">${t}</h1><p class="sub">How would you like to play today?</p><div class="level-grid"><button class="level-card" id="easy"><span class="level-emoji">🌱</span><span><span class="level-name">Easy</span><br><span class="level-desc">Simple pictures & easy words</span></span></button><button class="level-card" id="challenge"><span class="level-emoji">🚀</span><span><span class="level-name">Challenge</span><br><span class="level-desc">Think harder & explain why</span></span></button><button class="level-card" id="both"><span class="level-emoji">🌈</span><span><span class="level-name">Both Levels</span><br><span class="level-desc">A fun mix of everything!</span></span></button></div><button class="btn alt" id="back">← All topics</button>`);['easy','challenge','both'].forEach(l=>$(l).onclick=()=>begin(l));$('back').onclick=topics}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function begin(l){if(!playerName){welcome();return}resetCurrent();level=l;score=0;correctCount=0;questionDurations=[];assisted=false;lastRun=null;setScore();let s=settings(),pool=BANK.filter(q=>(topic==='Mixed Topics'||q.topic===topic)&&(l==='both'||q.level===l)&&(s.teacherLevel==='both'||q.level===s.teacherLevel));if(s.shuffle)shuffleArray(pool);questions=pool.slice(0,Math.min(s.count,pool.length));index=0;if(!questions.length){panel('<h2 class="title">Oops! No questions match.</h2><p class="sub">Change the level in Teacher Settings or choose another level.</p><button class="btn" id="back">Change level</button>');$('back').onclick=()=>levels(topic);return}question()}

function header(q){return `<div class="stage-top"><div class="stage-tags"><span class="pill">${ICONS[q.topic]||'🧩'} ${q.topic}</span><span class="pill level">${q.level==='easy'?'🌱 EASY':'🚀 CHALLENGE'}</span></div><span class="stepper">Puzzle ${index+1} of ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(index/questions.length*100)}"><div class="fill" style="width:${(index+1)/questions.length*100}%"></div></div>`}
function tiles(q,mode){return `<div class="choices">${q.options.map((o,i)=>`<button type="button" class="choice ${((mode==='choose'||mode==='speaking')&&selected===i)?'selected ':''}${mode==='answer'?(i===q.correct?'correct':i===selected?'wrong':''):''}" data-i="${i}" ${mode!=='choose'?'disabled':''} aria-label="Option ${'ABCD'[i]}: ${o.name}"><span class="letter">${'ABCD'[i]}</span><span class="pic">${o.emoji}</span><span class="name">${o.name}</span></button>`).join('')}</div>`}
function question(){resetCurrent();stage='question';selected=null;spoken=false;answered=false;transcript='';let q=questions[index];beginTimer();panel(header(q)+`<span class="stage-kicker">👀 STEP 1 · LOOK & CHOOSE</span><h1 class="stage-title">Which one is different?</h1><p class="sub">Look carefully and tap the odd one out!</p>`+timeStrip()+tiles(q,'choose')+`<span class="instruction">💡 Choose a picture to unlock speaking! Your clock keeps ticking during speaking.</span>`);app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(stage!=='question')return;selected=+b.dataset.i;speaking()})}

function speaking(){stage='speaking';let q=questions[index];panel(header(q)+`<span class="stage-kicker">🎤 STEP 2 · YOUR TURN TO SPEAK</span><h1 class="stage-title">Tell me <span style="color:#8169dc">WHY!</span></h1><p class="sub">Wonderful choice! Can you explain it in English?</p>`+timeStrip()+tiles(q,'speaking')+(settings().hints?`<div class="speech">💭 “I think the ___ is different because ___.”</div>`:'')+(settings().vi?`<p class="mini">Gợi ý: Hãy nói hình nào khác biệt và giải thích lý do.</p>`:'')+`<div class="speaking-card"><div class="mic-visual">🎙️</div><div class="status" id="micStatus">Speak to your teacher, or try the microphone!</div><div class="answerline hidden" id="transcript" aria-live="polite"></div><div><button class="btn coral" id="mic">🎙️ START SPEAKING</button><button class="btn alt" id="retry">🔄 TRY AGAIN</button></div><button class="btn green big-btn" id="done">✅ I'VE SPOKEN!</button><p class="mic-note">You can speak aloud without using the microphone. Your pronunciation is not automatically graded.</p></div>`);updateTimerBadge();$('mic').onclick=startMic;$('retry').onclick=()=>{stopMic();transcript='';$('transcript').classList.add('hidden');$('micStatus').textContent='Take another try! You can do it! 🌟'};$('done').onclick=()=>{if(stage!=='speaking')return;stopMic();spoken=true;check()}}

function startMic(){stopMic();const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){$('micStatus').textContent='Speech recognition is not available here. Speak to your teacher, then tap I’VE SPOKEN!';return}try{let r=new SpeechRecognition();recognition=r;r.lang='en-US';r.interimResults=true;r.continuous=false;r.onstart=()=>{if(stage==='speaking')$('micStatus').textContent='🔴 Listening… speak now!'};r.onresult=e=>{if(stage!=='speaking')return;transcript=Array.from(e.results).map(x=>x[0].transcript).join(' ');$('transcript').textContent='I heard: '+transcript;$('transcript').classList.remove('hidden')};r.onerror=e=>{if(stage==='speaking')$('micStatus').textContent='Microphone unavailable ('+e.error+'). Speak to your teacher instead.'};r.onend=()=>{if(stage==='speaking'&&$('micStatus').textContent.includes('Listening'))$('micStatus').textContent='Great effort! Try again or move on.'};r.start()}catch(e){$('micStatus').textContent='Could not start microphone. Speak to your teacher instead.'}}
function check(preview=false){if(stage==='answer')return;stopMic();stopTimer(true);if(preview)assisted=true;stage='answer';let q=questions[index],right=selected===q.correct;if(!answered&&!preview){if(right){score+=10;correctCount++}if(spoken)score+=5;answered=true;setScore()}let result=preview?'👀 Teacher preview':right?'🎉 Fantastic job!':'💖 Good try! Keep going!';panel(header(q)+`<span class="stage-kicker">⭐ STEP 3 · LEARN & SHINE</span><h1 class="stage-title">${result}</h1><p class="sub">Let's look at the correct answer together!</p>`+tiles(q,'answer')+`<div class="time-complete">⏱ Your time for this question: <strong>${formatDuration(questionDurations[index]||0)}</strong></div><div class="answer-banner">✅ Correct answer: ${'ABCD'[q.correct]} · ${q.options[q.correct].name}</div><div class="answerline">“${q.sample}”</div><p class="answer-title">🔎 The other three: <span style="color:#8b78cc">${q.common}</span></p>`+(settings().vi?`<p class="mini">💡 ${q.vi}</p>`:'')+(preview?`<p class="mini">Teacher preview used — this round will not enter the leaderboard.</p>`:'')+`<div><button class="btn alt" id="listen">🔊 LISTEN TO THE ANSWER</button><button class="btn" id="next">${index+1===questions.length?'🏆 SEE MY RESULTS':'➡️ NEXT PUZZLE'}</button></div>`);$('listen').onclick=()=>speak(q.sample);$('next').onclick=()=>{index++;if(index===questions.length)results();else question()}}

function results(){resetCurrent();stage='results';const rec=saveRun();const total=rec.totalMs;const history=questionDurations.map((ms,i)=>`<div class="time-cell">Puzzle ${i+1}<strong>⏱ ${formatDuration(ms||0)}</strong></div>`).join('');panel(`<div class="confetti" aria-hidden="true">🎊⭐🎉✨🎊</div><div class="result-visual">🏆</div><span class="eyebrow">🌟 ADVENTURE COMPLETE 🌟</span><h1 class="title">YOU DID IT, <span class="accent">${escapeHTML(playerName)}!</span></h1><p class="sub">You looked, chose, and spoke English. That's amazing!</p><div class="result-metrics"><div class="metric"><b>⭐ ${score}</b><span>TOTAL POINTS</span></div><div class="metric"><b>✅ ${correctCount}/${questions.length}</b><span>CORRECT PICTURES</span></div><div class="metric"><b>⏱ ${formatDuration(total)}</b><span>TOTAL TIME</span></div></div><details class="time-history"><summary>⏱ View time for every question</summary><div class="time-grid">${history}</div></details><p class="mini">${assisted?'⚠️ Teacher preview was used. This game is practice only, so it is not ranked.':'✅ Your result has been added to the leaderboard on this device.'} Speaking points reward participation, not pronunciation accuracy.</p><div><button class="btn green" id="viewRank">🏆 VIEW LEADERBOARD</button><button class="btn" id="again">🔄 PLAY AGAIN</button><button class="btn alt" id="topicBack">🏠 CHOOSE A TOPIC</button></div>`,'hero-panel');$('viewRank').onclick=()=>{returnFromBoard='topics';leaderboard({topic,level,count:String(questions.length)})};$('again').onclick=()=>begin(level);$('topicBack').onclick=topics}

$('homeBtn').onclick=()=>{if(!guardExit())return;topics()};$('leaderBtn').onclick=openBoard;$('settingsToggle').onclick=()=>$('settings').classList.toggle('hidden');$('closeSettings').onclick=()=>$('settings').classList.add('hidden');$('reset').onclick=()=>{if(!guardExit())return;$('settings').classList.add('hidden');topics()};$('clearBoard').onclick=()=>{if(confirm('Clear all leaderboard scores saved on this device? This cannot be undone.')){safeRemove(STORAGE_KEY);alert('Leaderboard cleared on this device.');if(stage==='leaderboard')leaderboard()}};$('preview').onclick=()=>{if(['question','speaking'].includes(stage)){if(selected===null){alert('Choose a picture first.');return}check(true);$('settings').classList.add('hidden')}else alert('Open a question first.')};welcome();
</script></body></html>
